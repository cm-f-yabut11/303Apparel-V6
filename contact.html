<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | 303 Apparel</title>
<meta name="description" content="Send 303 Apparel a message.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<header class="page-head"><div class="wrap"><h1>Contact us</h1><p>Questions about an order or a piece? Send us a message.</p></div></header>
<main class="section">
  <div class="wrap two-col">
    <section aria-labelledby="form-title">
      <h2 class="title" id="form-title">Send a message</h2>
      <form id="contactForm" novalidate>
        <div class="field"><label for="cName">Customer name</label><input id="cName" name="name" required autocomplete="name"></div>
        <div class="field"><label for="cEmail">Email address</label><input id="cEmail" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="cSubject">Subject</label><input id="cSubject" name="subject" required></div>
        <div class="field"><label for="cDate">Date</label><input id="cDate" name="date" readonly></div>
        <div class="field"><label for="cMsg">Message</label><textarea id="cMsg" name="message" required></textarea></div>
        <p class="msg" id="formMsg" role="status"></p>
        <button class="btn" type="submit" id="sendBtn">Submit</button>
      </form>
    </section>
    <aside class="info" aria-labelledby="info-title">
      <h3 id="info-title">Company information</h3>
      <dl id="infoList"></dl>
    </aside>
  </div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/contact.js"></script>
</body>
</html>
